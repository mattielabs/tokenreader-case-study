<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t2 d2">
  <title id="t2">TokenOps metadata-only privacy boundary</title>
  <desc id="d2">Above the boundary, request and response bodies, prompt text, credentials, and HMAC key material are processed in memory and discarded. Below the boundary, only allowlisted metadata is retained: trace identity, exact model, timing and outcome, normalized token counts, cost components, keyed equality fingerprints, and advisory findings.</desc>
  <style>
    .bg   { fill: #16161a; }
    .zoneA{ fill: #241a1e; stroke: #6b4a52; stroke-width: 1.25; }
    .zoneB{ fill: #191f1c; stroke: #3f6152; stroke-width: 1.25; }
    .chip { fill: #2a2a33; stroke: #3d3d48; stroke-width: 1; }
    .h    { fill: #f2f1ee; font-size: 16px; font-weight: 600; }
    .s    { fill: #a2a2ae; font-size: 12.5px; }
    .chipT{ fill: #ddd9f5; font-size: 12.5px; }
    .cap  { fill: #8b8b98; font-size: 11.5px; letter-spacing: .12em; font-weight: 600; }
    .warn { fill: #e0a3ad; font-size: 12.5px; font-weight: 600; }
    .ok   { fill: #8fd0b0; font-size: 12.5px; font-weight: 600; }
    .bnd  { stroke: #7c5cf0; stroke-width: 2; stroke-dasharray: 7 5; }
    .lnp  { stroke: #7c5cf0; stroke-width: 1.6; fill: none; }
    text  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="p2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c5cf0"/>
    </marker>
  </defs>

  <rect class="bg" width="900" height="470" rx="10"/>

  <text class="cap" x="34" y="34">IN MEMORY ONLY — DISCARDED WHEN THE REQUEST ENDS</text>
  <rect class="zoneA" x="34" y="48" width="832" height="132" rx="10"/>
  <rect class="chip" x="56" y="72" width="182" height="38" rx="6"/>
  <text class="chipT" x="72" y="96">Request / response bodies</text>
  <rect class="chip" x="254" y="72" width="150" height="38" rx="6"/>
  <text class="chipT" x="270" y="96">Prompt text</text>
  <rect class="chip" x="420" y="72" width="196" height="38" rx="6"/>
  <text class="chipT" x="436" y="96">Provider credentials</text>
  <rect class="chip" x="632" y="72" width="212" height="38" rx="6"/>
  <text class="chipT" x="648" y="96">Streaming content deltas</text>
  <rect class="chip" x="56" y="122" width="212" height="38" rx="6"/>
  <text class="chipT" x="72" y="146">HMAC fingerprint key</text>
  <rect class="chip" x="284" y="122" width="212" height="38" rx="6"/>
  <text class="chipT" x="300" y="146">Prompt Trim suggestions</text>
  <text class="warn" x="516" y="146">Never written to disk, logs, exports, or the browser.</text>

  <line class="bnd" x1="34" y1="212" x2="866" y2="212"/>
  <text class="h" x="34" y="204">Metadata-only boundary</text>
  <text class="s" x="286" y="204">enforced by allowlist, sentinel scans, and automated privacy checks</text>
  <path class="lnp" d="M450 180 L450 244" marker-end="url(#p2)"/>

  <text class="cap" x="34" y="272">PERSISTED — ALLOWLISTED METADATA</text>
  <rect class="zoneB" x="34" y="286" width="832" height="132" rx="10"/>
  <rect class="chip" x="56" y="310" width="166" height="38" rx="6"/>
  <text class="chipT" x="72" y="334">Trace and project</text>
  <rect class="chip" x="238" y="310" width="196" height="38" rx="6"/>
  <text class="chipT" x="254" y="334">Exact provider and model</text>
  <rect class="chip" x="450" y="310" width="196" height="38" rx="6"/>
  <text class="chipT" x="466" y="334">Timing, status, outcome</text>
  <rect class="chip" x="662" y="310" width="182" height="38" rx="6"/>
  <text class="chipT" x="678" y="334">Normalized token counts</text>
  <rect class="chip" x="56" y="360" width="196" height="38" rx="6"/>
  <text class="chipT" x="72" y="384">Cost components</text>
  <rect class="chip" x="268" y="360" width="222" height="38" rx="6"/>
  <text class="chipT" x="284" y="384">Keyed equality fingerprints</text>
  <rect class="chip" x="506" y="360" width="196" height="38" rx="6"/>
  <text class="chipT" x="522" y="384">Advisory findings</text>
  <text class="ok" x="718" y="384">No content, ever.</text>

  <text class="s" x="34" y="446">Keyed fingerprints reveal that two normalized blocks were equal; they do not reveal what either block said. That equality leakage is disclosed, and fingerprinting can be disabled or reset per project.</text>
</svg>
