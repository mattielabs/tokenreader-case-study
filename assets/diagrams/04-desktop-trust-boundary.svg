<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t4 d4">
  <title id="t4">TokenReader Windows desktop trust boundary</title>
  <desc id="d4">A sandboxed renderer talks only through a typed preload bridge to the Electron main process, which validates every call and brokers requests to a supervised, packaged Python gateway over loopback with a per-launch session secret. Provider keys live only in Windows Credential Manager. The offline licence is validated independently by the main process and by the gateway, and live traffic to the two official provider endpoints is impossible without both accepting it.</desc>
  <style>
    .bg   { fill: #16161a; }
    .card { fill: #1f1f26; stroke: #35353f; stroke-width: 1.25; }
    .accent { fill: #221d38; stroke: #7c5cf0; stroke-width: 1.5; }
    .h    { fill: #f2f1ee; font-size: 15px; font-weight: 600; }
    .s    { fill: #a2a2ae; font-size: 12.5px; }
    .lbl  { fill: #c6bdf5; font-size: 12px; font-weight: 600; letter-spacing: .04em; }
    .cap  { fill: #8b8b98; font-size: 11.5px; letter-spacing: .12em; font-weight: 600; }
    .no   { fill: #e0a3ad; font-size: 12.5px; }
    .ln   { stroke: #5a5a68; stroke-width: 1.6; fill: none; }
    .lnp  { stroke: #7c5cf0; stroke-width: 1.6; fill: none; }
    .cut  { stroke: #6b4a52; stroke-width: 1.6; stroke-dasharray: 6 5; fill: none; }
    text  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a68"/>
    </marker>
    <marker id="ap4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c5cf0"/>
    </marker>
  </defs>

  <rect class="bg" width="900" height="470" rx="10"/>
  <text class="cap" x="34" y="34">WINDOWS DESKTOP — ONE PROCESS BOUNDARY PER TRUST LEVEL</text>

  <rect class="card" x="34" y="52" width="186" height="80" rx="8"/>
  <text class="h" x="50" y="80">Renderer</text>
  <text class="s" x="50" y="100">Sandboxed React UI</text>
  <text class="s" x="50" y="117">no Node, no network</text>

  <rect class="card" x="254" y="52" width="186" height="80" rx="8"/>
  <text class="h" x="270" y="80">Preload bridge</text>
  <text class="s" x="270" y="100">Named methods only</text>
  <text class="s" x="270" y="117">no generic invoke</text>

  <rect class="accent" x="474" y="52" width="186" height="80" rx="8"/>
  <text class="h" x="490" y="80">Electron main</text>
  <text class="s" x="490" y="100">Validates every call</text>
  <text class="s" x="490" y="117">owns paths and secrets</text>

  <rect class="accent" x="694" y="52" width="172" height="80" rx="8"/>
  <text class="h" x="710" y="80">Gateway child</text>
  <text class="s" x="710" y="100">Packaged Python</text>
  <text class="s" x="710" y="117">loopback + secret</text>

  <path class="ln" d="M220 92 L248 92" marker-end="url(#a4)"/>
  <path class="ln" d="M440 92 L468 92" marker-end="url(#a4)"/>
  <path class="lnp" d="M660 92 L688 92" marker-end="url(#ap4)"/>

  <text class="cap" x="34" y="166">WHAT THE MAIN PROCESS AND THE GATEWAY EACH GUARD</text>

  <rect class="card" x="34" y="222" width="262" height="96" rx="8"/>
  <text class="h" x="50" y="250">Windows Credential Manager</text>
  <text class="s" x="50" y="272">Provider keys and the local SDK token</text>
  <text class="s" x="50" y="289">Read by main only · no plaintext fallback</text>
  <text class="s" x="50" y="306">Handed to the child over stdin, never argv</text>

  <rect class="card" x="320" y="222" width="262" height="96" rx="8"/>
  <text class="h" x="336" y="250">Offline licence file</text>
  <text class="s" x="336" y="272">Ed25519-signed canonical JSON, ≤ 8 KB</text>
  <text class="s" x="336" y="289">Validated twice: main for UX, gateway</text>
  <text class="s" x="336" y="306">for enforcement · no server, no binding</text>

  <rect class="card" x="606" y="222" width="260" height="96" rx="8"/>
  <text class="h" x="622" y="250">Two provider endpoints</text>
  <text class="s" x="622" y="272">api.openai.com · api.anthropic.com</text>
  <text class="s" x="622" y="289">Live only with a valid licence and an</text>
  <text class="s" x="622" y="306">explicit per-provider opt-in · zero retries</text>

  <path class="ln" d="M567 132 L567 190 L165 190 L165 216" marker-end="url(#a4)"/>
  <path class="ln" d="M567 132 L567 190 L451 190 L451 216" marker-end="url(#a4)"/>
  <path class="lnp" d="M780 132 L780 216" marker-end="url(#ap4)"/>

  <text class="cap" x="34" y="352">NEVER, BY CONSTRUCTION</text>
  <path class="cut" d="M34 362 L866 362"/>
  <text class="no" x="34" y="386">No key in the renderer  ·  no key on disk outside the vault  ·  no request on first launch  ·  no live mode without a licence both validators accepted</text>
  <text class="s" x="34" y="410">Fixture mode is the default and works without a licence. Everything local (data, exports, backups, purge, receipts, diagnostics) works without one too.</text>
  <text class="s" x="34" y="430">Development builds are unsigned and labelled as such. Production trust registries are committed empty and fail closed until real keys exist.</text>
  <text class="lbl" x="34" y="452">The renderer never learns the gateway port or the per-launch 256-bit session secret; the main process brokers every request.</text>
</svg>
